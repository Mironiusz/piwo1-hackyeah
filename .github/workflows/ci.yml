name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  python:
    name: Python gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            db/pyproject.toml

      - name: Install the dependencies
        id: install
        run: |
          python -m venv venv
          venv/bin/python -m pip install ./db
          venv/bin/python -m pip install -e ".[dev]"
          echo "${GITHUB_WORKSPACE}/venv/bin" >> "$GITHUB_PATH"

      - name: Lint and format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make lint-python

      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make typecheck

      - name: Dead code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make deadcode

      - name: Dependency declarations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make deps

      - name: Static security analysis
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make security

      - name: Dependency vulnerabilities
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make audit

      - name: Tests without the critical ones
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make test-unit

  node:
    name: Node gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install the dependencies
        id: install
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Markdown format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make lint-docs

      - name: Frontend format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make frontend-format-check

      - name: Frontend type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make frontend-typecheck

      - name: Frontend lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make frontend-lint

      - name: Frontend tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make frontend-test
