<html lang="en">
	<head>
		<meta charset="utf-8">

		<title>reveal.js - Speaker View</title>

		<style>
			body {
				font-family: Helvetica;
				font-size: 18px;
			}

			#current-slide,
			#upcoming-slide,
			#speaker-controls {
				padding: 6px;
				box-sizing: border-box;
				-moz-box-sizing: border-box;
			}

			#current-slide iframe,
			#upcoming-slide iframe {
				width: 100%;
				height: 100%;
				border: 1px solid #ddd;
			}

			#current-slide .label,
			#upcoming-slide .label {
				position: absolute;
				top: 10px;
				left: 10px;
				z-index: 2;
			}

			#connection-status {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 20;
				padding: 30% 20% 20% 20%;
				font-size: 18px;
				color: #222;
				background: #fff;
				text-align: center;
				box-sizing: border-box;
				line-height: 1.4;
			}

			.overlay-element {
				height: 34px;
				line-height: 34px;
				padding: 0 10px;
				text-shadow: none;
				background: rgba( 220, 220, 220, 0.8 );
				color: #222;
				font-size: 14px;
			}

			.overlay-element.interactive:hover {
				background: rgba( 220, 220, 220, 1 );
			}

			#current-slide {
				position: absolute;
				width: 60%;
				height: 100%;
				top: 0;
				left: 0;
				padding-right: 0;
			}

			#upcoming-slide {
				position: absolute;
				width: 40%;
				height: 40%;
				right: 0;
				top: 0;
			}

			/* Speaker controls */
			#speaker-controls {
				position: absolute;
				top: 40%;
				right: 0;
				width: 40%;
				height: 60%;
				overflow: auto;
				font-size: 18px;
			}

				.speaker-controls-time.hidden,
				.speaker-controls-notes.hidden {
					display: none;
				}

				.speaker-controls-time .label,
				.speaker-controls-pace .label,
				.speaker-controls-notes .label {
					text-transform: uppercase;
					font-weight: normal;
					font-size: 0.66em;
					color: #666;
					margin: 0;
				}

				.speaker-controls-time, .speaker-controls-pace {
					border-bottom: 1px solid rgba( 200, 200, 200, 0.5 );
					margin-bottom: 10px;
					padding: 10px 16px;
					padding-bottom: 20px;
					cursor: pointer;
				}

				.speaker-controls-time .reset-button {
					opacity: 0;
					float: right;
					color: #666;
					text-decoration: none;
				}
				.speaker-controls-time:hover .reset-button {
					opacity: 1;
				}

				.speaker-controls-time .timer,
				.speaker-controls-time .clock {
					width: 50%;
				}

				.speaker-controls-time .timer,
				.speaker-controls-time .clock,
				.speaker-controls-time .pacing .hours-value,
				.speaker-controls-time .pacing .minutes-value,
				.speaker-controls-time .pacing .seconds-value {
					font-size: 1.9em;
				}

				.speaker-controls-time .timer {
					float: left;
				}

				.speaker-controls-time .clock {
					float: right;
					text-align: right;
				}

				.speaker-controls-time span.mute {
					opacity: 0.3;
				}

				.speaker-controls-time .pacing-title {
					margin-top: 5px;
				}

				.speaker-controls-time .pacing.ahead {
					color: blue;
				}

				.speaker-controls-time .pacing.on-track {
					color: green;
				}

				.speaker-controls-time .pacing.behind {
					color: red;
				}

				.speaker-controls-notes {
					padding: 10px 16px;
				}

				.speaker-controls-notes .value {
					margin-top: 5px;
					line-height: 1.4;
					font-size: 1.2em;
				}

			/* Layout selector\xA0*/
			#speaker-layout {
				position: absolute;
				top: 10px;
				right: 10px;
				color: #222;
				z-index: 10;
			}
				#speaker-layout select {
					position: absolute;
					width: 100%;
					height: 100%;
					top: 0;
					left: 0;
					border: 0;
					box-shadow: 0;
					cursor: pointer;
					opacity: 0;

					font-size: 1em;
					background-color: transparent;

					-moz-appearance: none;
					-webkit-appearance: none;
					-webkit-tap-highlight-color: rgba(0, 0, 0, 0);
				}

				#speaker-layout select:focus {
					outline: none;
					box-shadow: none;
				}

			.clear {
				clear: both;
			}

			/* Speaker layout: Wide */
			body[data-speaker-layout="wide"] #current-slide,
			body[data-speaker-layout="wide"] #upcoming-slide {
				width: 50%;
				height: 45%;
				padding: 6px;
			}

			body[data-speaker-layout="wide"] #current-slide {
				top: 0;
				left: 0;
			}

			body[data-speaker-layout="wide"] #upcoming-slide {
				top: 0;
				left: 50%;
			}

			body[data-speaker-layout="wide"] #speaker-controls {
				top: 45%;
				left: 0;
				width: 100%;
				height: 50%;
				font-size: 1.25em;
			}

			/* Speaker layout: Tall */
			body[data-speaker-layout="tall"] #current-slide,
			body[data-speaker-layout="tall"] #upcoming-slide {
				width: 45%;
				height: 50%;
				padding: 6px;
			}

			body[data-speaker-layout="tall"] #current-slide {
				top: 0;
				left: 0;
			}

			body[data-speaker-layout="tall"] #upcoming-slide {
				top: 50%;
				left: 0;
			}

			body[data-speaker-layout="tall"] #speaker-controls {
				padding-top: 40px;
				top: 0;
				left: 45%;
				width: 55%;
				height: 100%;
				font-size: 1.25em;
			}

			/* Speaker layout: Notes only */
			body[data-speaker-layout="notes-only"] #current-slide,
			body[data-speaker-layout="notes-only"] #upcoming-slide {
				display: none;
			}

			body[data-speaker-layout="notes-only"] #speaker-controls {
				padding-top: 40px;
				top: 0;

<p>Na to nakładamy zgłoszenia ludzi, z datą ostatniego potwierdzenia. Adres wyszukujemy z naszego serwera, bez danych osoby. Otwarte dane miasta i MSIP dołączymy po sprawdzeniu warunków każdego zbioru.</p>`},architecture:{summary:`architektura: dane osobno, prezentacja osobno`,heading:`Dane osobno, prezentacja osobno`,ingest:{head:`Pozyskanie danych`,items:[`wycinek OpenStreetMap`,`importer tagów`,`PostGIS: fakty i głosy`,`Valhalla: graf tras`]},api:{head:`API`,items:[`Python, FastAPI`,`16 operacji`,`jeden kontrakt`]},clients:{head:`Klienci`,items:[`web: React, MapLibre`,`HarmonyOS: ArkTS`]},extendHead:`Jak rozszerzyć`,extend:[`nowe źródło: importer do modelu faktu`,`nowa kategoria: reguła tagu`,`nowe miasto: wycinek i graf`],privacyHead:`Prywatność`,privacy:[`potrzeby tylko na urządzeniu`,`zapytanie o trasę nie opuszcza projektu`,`konto bez e-maila`],notes:`<p>Architektura oddziela pozyskanie danych od prezentacji. Importer czyta wycinek OpenStreetMap, zamienia tagi na bariery i udogodnienia i zapisuje je w PostGIS, a silnik Valhalla liczy trasy na naszym grafie.</p>
<p>[click] Wszystko wystawia jedno API z szesnastoma operacjami. Korzystają z niego dwa niezależne klienty: aplikacja webowa i aplikacja HarmonyOS.</p>

<p>[click] Płacą ci, którzy zyskują na dostępności. Miasto i zarządcy dróg dostają wdrożenie i potwierdzone przez mieszkańców zgłoszenia barier w jednym miejscu. Hotele, muzea i organizatorzy wydarzeń kupują trasę bez barier do swojego wejścia. Partnerzy mogą finansować nagrody za potwierdzenia, na przykład bilet komunikacji miejskiej.</p>

<p>[click] If they have a map at all, it gives one label: accessible or not. It does not say where the information comes from, how old it is, or whether anyone checked it.</p>`},solution:{summary:`the answer: needs, route, facts`,heading:`Needs, route, facts`,steps:[{head:`Needs`,text:`What you avoid and what you need. No question about disability.`},{head:`Route`,text:`A walking route in Kraków that avoids the barriers of your needs.`},{head:`Facts`,text:`Every barrier and amenity with its source, date and status.`}],footer:`The app shows facts. The judgement stays with you.`,notes:`<p>EnableMe works in three steps.</p>
<p>[click] First the needs: you mark what you avoid and what you need, or pick a preset. We never ask about a disability, because preferences are enough to match a route.</p>
<p>[click] Then a walking route in Kraków that avoids the barriers of your needs.</p>
<p>[click] And the facts: every barrier and every amenity has a source, a date and a status. No stars and no verdict. The judgement stays with you.</p>`},states:{summary:`the four states of a route segment`,heading:`Every segment tells what we know about it`,legend:[{key:`barrier`,label:`a barrier from your needs`},{key:`clear`,label:`no barriers, full data`},{key:`partial`,label:`partial data`},{key:`nodata`,label:`no data`}],grayscale:`the same route in grayscale`,rule:`Missing information is never shown as accessible.`,channels:`A state is carried by color, icon and line pattern. Under the map the same route is a text list.`,notes:`<p>A route is not simply green or red. Every segment has one of four states: a barrier from your needs, no barriers with full data, partial data, or no data.</p>
<p>[click] The key rule: missing information never pretends to be accessible. A segment we know nothing about is grey and dashed, not green.</p>
<p>[click] Each state is carried by color, an icon and a line pattern, so the states stay apart even in grayscale. Under the map the same route is a text list: the text alternative of the map for a screen reader.</p>`},facts:{summary:`facts, votes and contradictory data`,heading:`The community keeps the data current`,card:{type:`High kerb`,sourceLabel:`source`,source:`user report`,dateLabel:`date`,date:`2026-10-04`,statusLabel:`status`,status:`unverified`,conflict:`Map data (OpenStreetMap): lowered kerb`,rule:`Until the report has 2 confirmations, the map data counts.`},votes:[`Still there`,`Gone`],statuses:[`unverified`,`confirmed`,`disputed`,`outdated`],rules:[`one vote per fact per day`,`the latest 5 people count`,`a vote without an account weighs half`,`flags and moderation`],notes:`<p>The data lives because of people. Anyone can report a barrier, an amenity or an inaccessible area, with or without an account.</p>
<p>[click] Every fact, OpenStreetMap facts included, can be confirmed as still there or reported as gone. The latest votes of five people give the status: unverified, confirmed, disputed or outdated.</p>
<p>[click] Here is the case of contradictory data: a user reported a high kerb, OpenStreetMap says the kerb is lowered. We show both with their status instead of deciding for the user. Until the report collects two confirmations, the map data counts. Vote limits, flags and a moderator protect against abuse.</p>`},demo:{summary:`the live demo`,heading:`Live`,steps:[{head:`Needs`,text:`I use a wheelchair`},{head:`Route`,text:`Tauron Arena - Ogród Doświadczeń`},{head:`No barrier-free route`,text:`Park Lotników Polskich`},{head:`Contradictory data`,text:`a report against the map data`}],footnote:`The HarmonyOS app on the emulator. The reports in the demo are sample data around the Tauron Arena, marked as such in the app.`,notes:`<p>Now live, on the HarmonyOS emulator.</p>
<p>We set the needs: I use a wheelchair. We plan a route from the Tauron Arena to Ogród Doświadczeń: a confirmed high kerb, unverified stairs with an alternative route, the stretches without data under What we do not know.</p>
<p>To Park Lotników Polskich there is no route without barriers: the app says so plainly and shows the route with the fewest barriers.</p>
<p>Finally a high kerb reported by a user that contradicts OpenStreetMap: source, date, status and the vote.</p>
<p>What the emulator cannot show: the location of a real walk, so the start is an address. If the emulator fails: the recorded video from the same scene.</p>`},data:{summary:`the data sources, their freshness and unavailability`,heading:`Where the data comes from, and when it is missing`,head:[`source`,`what it gives`,`freshness`,`when unavailable`],rows:[[`OpenStreetMap (ODbL)`,`barriers, amenities, pedestrian network, map`,`a copy dated by the OSM state`,`the last complete copy with its date`],[`People's reports`,`points and areas`,`the date of the last confirmation`,`-`],[`Address search (Nominatim)`,`an address to a point`,`on request, from our server`,`a plain message, no guessing`],[`City data (open data, MSIP)`,`the next step`,`after checking the terms`,`not used yet`]],footer:`Every fact has a status from votes, an OpenStreetMap fact included.`,notes:`<p>We need neither a database kept by hand by the city nor access to its internal systems. The base is OpenStreetMap: an extract of Kraków, taken as a whole or not at all. The app always shows the date of the copy, and when the source is unavailable it works on the last complete copy.</p>
<p>On top of it come people's reports, with the date of their last confirmation. Addresses are searched from our server, without anything that identifies the person. Open city data joins once the terms of each dataset are checked.</p>`},architecture:{summary:`the architecture: data apart from presentation`,heading:`Data apart from presentation`,ingest:{head:`Data acquisition`,items:[`OpenStreetMap extract`,`tag importer`,`PostGIS: facts and votes`,`Valhalla: route graph`]},api:{head:`API`,items:[`Python, FastAPI`,`16 operations`,`one contract`]},clients:{head:`Clients`,items:[`web: React, MapLibre`,`HarmonyOS: ArkTS`]},extendHead:`How it grows`,extend:[`a new source: an importer to the fact model`,`a new category: a tag rule`,`a new city: an extract and a graph`],privacyHead:`Privacy`,privacy:[`needs stay on the device`,`a route request never leaves the project`,`an account without an email`],notes:`<p>The architecture separates data acquisition from presentation. The importer reads the OpenStreetMap extract, turns tags into barriers and amenities and stores them in PostGIS, and the Valhalla engine computes routes on our own graph.</p>
<p>[click] One API with sixteen operations serves two independent clients: the web app and the native HarmonyOS app in ArkTS and ArkUI. The HarmonyOS client uses the platform: LocationKit for the start from the current location, LocalizationKit for the language of the system, CoreFileKit to keep the needs and votes on the device, CryptoArchitectureKit for passwords, InputKit for the map with a keyboard.</p>
<p>[click] A new source is a new importer into the same fact model, a new category is a tag rule, a new city is a new extract and graph. Privacy is built in: the needs stay on the device, a route request never leaves the project, an account needs no email.</p>`},business:{summary:`the business model and operation`,heading:`Business model and operation`,free:{head:`Free`,items:[`residents and tourists`,`no ads`,`no selling of data about people`]},paid:{head:`Paying`,items:[`cities and road authorities: deployment and barrier reports in one place`,`venues and event organizers: a barrier-free route to their entrance`,`partners of a reward programme for confirmations`]},run:{head:`Run outside the city infrastructure`,items:[`an operator hosts one server with containers`,`data refresh and updates`,`moderation of reports`]},footer:`We sell the service, not the data: OpenStreetMap data stays open.`,notes:`<p>For residents and tourists the app is free.</p>
<p>[click] Those who gain from accessibility pay. Cities and road authorities get the deployment and the barrier reports confirmed by residents in one place. Hotels, museums and event organizers buy a barrier-free route to their entrance. Partners can fund rewards for confirmations, such as a public transport ticket.</p>
<p>[click] An operator runs the service outside the infrastructure of the city: one server with containers, data refresh, updates and moderation. We sell the service, not the data: what comes from OpenStreetMap stays open.</p>`},status:{summary:`what works and what is next`,heading:`What works and what is next`,works:{head:`Works today`,items:[`needs and presets`,`a route with four segment states and a list`,`an alternative route and no barrier-free route`,`facts with source, date, status and votes`,`reports, accounts, moderation, Polish and English`]},next:{head:`Next`,items:[`the server with the data of all of Kraków`,`photos in reports`,`open city data`,`reports back to OpenStreetMap`,`more cities`]},limits:`Known limits of the prototype: sample data around the Tauron Arena, the hosted demo over plain HTTP.`,closing:`EnableMe - facts instead of labels.`,notes:`<p>Today the whole main scenario runs on HarmonyOS, on sample data marked as such.</p>
<p>[click] Next: the server with the data of all of Kraków, photos in reports, open city data, sending reports back to OpenStreetMap and more cities.</p>
