[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# This section exists only so that the dependency list has one place readable by all
# the check tools - the project is not a package for distribution. The version is fixed and means nothing.
# The project fills in the service name and dependencies. A dependency the code does not import directly (a driver loaded
# by the dialect name, an entry point, runtime support) gets an entry in DEP002 below together with the reason.
[project]
name = "piwo1-hackyeah"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "bandit[toml]==1.9.4",
    "deptry==0.25.1",
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.2",
    "vulture==2.16",
]

# The code is not packaged: it gets into the container through COPY, not through installation, and it is executed
# from PYTHONPATH. An empty module list turns off automatic package discovery, so the installation
# creates only the metadata with the dependencies - without a second copy of the code in the packages directory.
[tool.setuptools]
py-modules = []

# The package metadata directory and the build working directory, both created on every installation,
# land in .cache instead of the repository root. Setuptools does not create the directory given in egg-base,
# so .cache/.gitkeep is versioned - without it the installation on a fresh clone fails while building
# the metadata.
[tool.distutils.egg_info]
egg-base = ".cache"

[tool.distutils.build]
build-base = ".cache/build"

[tool.ruff]
target-version = "py313"
line-length = 200
src = ["."]
# The working directories of the tools gather in .cache, so that the repository root shows only what
# somebody wrote. Each tool has its own key for that and each of those keys stands in this file.
cache-dir = ".cache/ruff"
exclude = [
    ".venv",
    "venv",
    ".git",
    ".cache",
    "__pycache__",
    "build",
    "dist",
    "node_modules",
]
# Markdown files are out of scope: since 0.16 ruff formats code blocks in documentation, and with
# docstring-code-format turned on this meant that "make format" rewrites the examples in docs/ together with the code.
# Formatting of examples in the docstrings of the code itself stays on and keeps working.
extend-exclude = ["*.md"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "C90",
    "A",
    "N",
    "RUF",
    "G",
]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 15

# N803 turned off in tests/: fixtures are deliberately named like the class they return, not a typo.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N803"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

# The directory list covers only the hooks today, because the template has no service code. The project adds here
# the layer directories together with the first code. A project using Pydantic models also adds the
# pydantic.mypy plugin: without it mypy reports missing arguments when creating the settings model, because it does not know that
# the values come from the environment.
[tool.mypy]
files = [".claude/hooks"]
cache_dir = ".cache/mypy"

[tool.vulture]
# Tests are scanned too: a use in a test is a use.
paths = [".claude/hooks", "tests"]
# The confidence threshold is raised from the default sixty, because Pydantic model fields and ORM columns are assembled
# by the library by name, and vulture does not see that and reports them as dead. What the gate stops seeing at this
# threshold: an unused function, class, method, attribute and variable - vulture assigns them
# sixty percent confidence. Unused imports and local variables are still caught by ruff with the F rule family,
# and unused function parameters and unreachable code stay visible here, because they have one hundred percent.
min_confidence = 61

[tool.deptry]
# The dev group is tools run from the command line, not imported by the code. Without this entry deptry
# reports each of them as declared and unused, because it looks for them in the imports - and they will never be there.
optional_dependencies_dev_groups = ["dev"]
# Bandit has no configuration section here and that is a decision, not an oversight. A suppression is to apply
# only in the place where its reason stands, and bandit can suppress only globally - one
# list in this file would also silence code that does not exist yet. The scope therefore stands next to the calls
# in the makefile, together with the reason for each suppression. The bandit[toml] entry stays on the dependency list
# as a safeguard: if somebody ever added [tool.bandit] here, bandit without this extra would ignore
# the section quietly, without any error.

[tool.coverage.run]
data_file = ".cache/coverage"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".cache/pytest"
markers = [
    "integration: integration tests (they glue several layers together; no real network and no real database)",
    "critical: critical tests (real dependencies, e.g. a DB; they should fail the environment fast when something does not work)",
]
